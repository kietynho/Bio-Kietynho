<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#f5f5f7">

    <title>Photo Booth</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<main class="app">

    <header class="app-header">

        <h1>Photo Booth</h1>

    </header>

    <section class="camera-section">

        <div class="camera-container">

            <video id="camera" autoplay playsinline muted></video>

            <div id="camera-placeholder" class="camera-placeholder">

                <span>Camera chưa được bật</span>

            </div>

            <div id="countdown" class="countdown"></div>

        </div>

        <div id="capture-status" class="capture-status">

            Chọn khung trước khi chụp

        </div>

        <div class="camera-controls">

            <button id="capture-btn" type="button" disabled>

                Chụp ảnh 1

            </button>

            <button id="start-camera" type="button">

                Bật camera

            </button>

            <button id="switch-camera" type="button" disabled>

                Đổi camera

            </button>

        </div>

    </section>

    <section class="frame-section">

        <h2>Chọn khung</h2>

        <p class="frame-warning">

            Chọn khung trước khi chụp

        </p>

        <div id="frame-list" class="frame-list">

            <button

                class="frame-item"

                type="button"

                data-frame="frame1">

                <img

                    src="images/frame1.png"

                    alt="Khung 1">

            </button>

            <button

                class="frame-item"

                type="button"

                data-frame="frame2">

                <img

                    src="images/frame2.png"

                    alt="Khung 2">

            </button>

            <button

                class="frame-item"

                type="button"

                data-frame="frame3">

                <img

                    src="images/frame3.png"

                    alt="Khung 3">

            </button>

        </div>

    </section>

    <section class="photos-section">

        <h2>Ảnh đã chụp</h2>

        <div class="photos-grid">

            <div class="photo-slot">

                <span>Ảnh 1</span>

                <img id="photo-1" alt="Ảnh 1">

            </div>

            <div class="photo-slot">

                <span>Ảnh 2</span>

                <img id="photo-2" alt="Ảnh 2">

            </div>

            <div class="photo-slot">

                <span>Ảnh 3</span>

                <img id="photo-3" alt="Ảnh 3">

            </div>

        </div>

    </section>

    <section class="preview-section">

        <h2>Ảnh đã ghép</h2>

        <div class="preview-container">

            <canvas id="result-canvas"></canvas>

            <div

                id="preview-placeholder"

                class="preview-placeholder">

                <span>Ảnh đã ghép sẽ xuất hiện ở đây</span>

            </div>

        </div>

        <div class="result-controls">

            <button

                id="retake-btn"

                type="button"

                disabled>

                Chụp lại

            </button>

            <button

                id="download-btn"

                type="button"

                disabled>

                Tải ảnh

            </button>

        </div>

    </section>

</main>

<script src="script.js"></script>

</body>

</html>
